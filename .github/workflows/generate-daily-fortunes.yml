name: Generate daily fortunes

# 「今日の運勢」用のAI鑑定文（ライフパス別）を毎日生成し、変化があれば自動コミット→Vercel自動デプロイ。
on:
  schedule:
    # 毎日 22:30 UTC（＝日本時間 翌 07:30）… 朝の閲覧に間に合わせる
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily fortunes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-daily-fortunes.mjs

      - name: Guard against stub
        run: |
          MODEL=$(node -e "console.log(require('./public/data/daily-fortunes.json').model)")
          echo "生成モデル: $MODEL"
          if [ "$MODEL" = "stub" ]; then
            echo "::error::スタブが生成されました。ANTHROPIC_API_KEY のSecret設定を確認してください。"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/daily-fortunes.json
          if git diff --staged --quiet; then
            echo "変更なし（スキップ）"
          else
            git commit -m "chore: refresh daily fortunes"
            git push
          fi
