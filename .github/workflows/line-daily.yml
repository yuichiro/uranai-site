name: LINE daily broadcast

# 毎朝、今日のエンジェルナンバー鑑定文をLINEで一斉配信する。
# LINE_CHANNEL_ACCESS_TOKEN（Secret）未設定の間はドライラン（配信しない）。
on:
  schedule:
    # 毎日 23:00 UTC（＝日本時間 翌 08:00）に配信
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Broadcast today's angel number to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node scripts/broadcast-line.mjs
